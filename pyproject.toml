[project]
name = "babyface"
version = "0.1.0"
description = "Infant photo identity clustering using patch-level embeddings and temporal signals"
authors = [
    { name = "Bill Thorp", email = "bill3000@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0",
    # Helion GPU kernel DSL — requires Linux + CUDA/ROCm + Triton 3.5+ at runtime.
    # CPU fallback is provided in embeddings/kernels.py when Helion cannot compile.
    # Install guide: https://github.com/pytorch/helion
    "helion",
    # Image / EXIF
    "Pillow>=10.0",
    "exifread>=3.0",
    # Data / clustering
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    # CLI / display
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "pillow-heif>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipython",
    "jupyter",
]

[project.scripts]
babyface = "babyface.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babyface"]

[tool.uv]
# For GPU support, add the matching PyTorch wheel index:
#   uv pip install torch --extra-index-url https://download.pytorch.org/whl/cu124
